spring.application.name=terrain-reservation-backend

# ════════════════════════════════════════════════════════════════
#  BASE DE DONNÉES — modifiez ces 3 lignes selon votre config MySQL
# ════════════════════════════════════════════════════════════════
spring.datasource.url=jdbc:mysql://localhost:3306/terrain_reservation
spring.datasource.username=root
spring.datasource.password=VOTRE_MOT_DE_PASSE_MYSQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
server.servlet.context-path=/api

# JWT
jwt.secret=SaaS-Terrain-Reservation-Secret-Key-2026-Must-Be-Very-Long-256-Bits
jwt.expiration=86400000

# CORS — autorise le frontend Vite sur localhost:5173
cors.allowed-origins=http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Commission SaaS
saas.commission.percentage=10

# PDF
pdf.storage.path=./generated-pdfs

# Logs
logging.level.root=INFO
logging.level.com.terrainreservation=DEBUG

# Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
